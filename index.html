function tagAdd(cid){const n=$('#tn').value.trim();if(!n)return;mut(()=>{const c=G().ch.find(x=>x.id===cid);(c.tags=c.tags||[]).push({id:nid(),name:n,emoji:$('#te').value,color:$('#tc').value})});chSet(cid)}
function tagDel(cid,id){mut(()=>{const c=G().ch.find(x=>x.id===cid);c.tags=c.tags.filter(x=>x.id!==id)});chSet(cid)}
function svProf(){const r=MR(UID);open(`<h2>${t('editprof')}</h2><div class="row"><label style="width:110px">${t('nick')}</label><input id="sp1" value="${esc(r.nick||'')}"></div><div class="row"><label style="width:110px">${t('nstyle')}</label><select id="sp2">${[['','ns_none'],['grad','ns_grad'],['neon','ns_neon'],['shimmer','ns_shimmer'],['rainbow','ns_rainbow']].map(([k,l])=>`<option value="${k}" ${(r.ns||'')===k?'selected':''}>${t(l)}</option>`).join('')}</select></div><div class="row"><button onclick="mut(()=>{MR(UID).nick=$('#sp1').value;MR(UID).ns=$('#sp2').value});closeM()">${t('save')}</button></div>`)}
function rolesTab(){const g=G(),r=g.roles.find(x=>x.id===S_rsel)||g.roles[0];S_rsel=r.id;const ed=canEditRole(r),[cl,st]=[r.color2?`background:linear-gradient(90deg,${r.color},${r.color2});-webkit-background-clip:text;background-clip:text;color:transparent;`:`color:${r.color};`,r.glow?`filter:drop-shadow(0 0 5px ${r.color})`:''];
 return `<div class="row"><button onclick="addRole()">＋ ${t('newrole')}</button><small>${t('hierhint')}</small></div><div class="rl2"><div>`+
 g.roles.map(x=>`<div class="nvi ${x.id===r.id?'on':''}" onclick="S_rsel='${x.id}';srvSet('roles')"><span><span style="color:${x.color}">●</span> ${esc(x.name)} ${x.badge}</span><span class="ar"><a onclick="event.stopPropagation();mvRole('${x.id}',-1)">▲</a><a onclick="event.stopPropagation();mvRole('${x.id}',1)">▼</a></span></div>`).join('')+`</div><div>`+(ed?'':`<p style="color:var(--rd)">${t('noedit')}</p>`)+
 `<fieldset ${ed?'':'disabled'} style="border:0;padding:0;margin:0"><div style="font-size:20px;font-weight:800;margin-bottom:8px;${cl}${st}">${esc(r.name)}</div>
 <div class="row"><label style="width:120px">${t('rname')}</label><input value="${esc(r.name)}" onchange="setRole('name',this.value)"></div>
 <div class="row"><label style="width:120px">${t('rcolor')}</label><input type="color" value="${r.color}" onchange="setRole('color',this.value)"><label style="margin-left:8px">${t('grad2')}</label><input type="color" value="${r.color2||r.color}" onchange="setRole('color2',this.value)"><button class="g" onclick="setRole('color2','')">✕</button></div>
 <div class="row"><label style="width:120px">${t('rbadge')}</label><input value="${esc(r.badge)}" maxlength="4" onchange="setRole('badge',this.value)"></div>${swr('glow','',r.glow,"setRole('glow',this.checked?1:0)")}<h4>${t('perms')}</h4>`+
 PL.map(k=>`<div class="row"><span style="flex:1">${t('p_'+k)}</span>${sw(r.perm&P[k],`setPerm(${P[k]},this.checked)`)}</div>`).join('')+`<div class="row"><button class="r" onclick="delRole('${r.id}')">${t('del')}</button></div></fieldset></div></div>`}
function setRole(f,v){const r=selRole();if(!canEditRole(r))return;const id=r.id;mut(()=>{const x=G().roles.find(y=>y.id===id);if(v===''||v===0)delete x[f];else x[f]=v;audit('ROLE_UPDATE',x.name)});srvSet('roles')}

/* ---------- staff: control center ---------- */
const TKS={open:'🟢',pending:'🟡',closed:'⚫'};
function tkHtml(staff){const all=plat().tickets;UI.tkCtx=staff?'staff':'user';UI.tf=UI.tf||'open';
 if(UI.tk){const x=all.find(y=>y.id===UI.tk);if(x&&(staff||x.uid===UID)){const u=U(x.uid);
  return `<div class="row"><button class="g" onclick="UI.tk=null;reTk()">← ${t('back')}</button><b style="flex:1">${TKS[x.status]} ${esc(x.subj)}</b><small>${esc(x.cat)}</small></div>`+(staff?`<div class="row"><small style="flex:1">${esc(u?.name||'?')} · ${x.as?t('assigned')+' '+esc(U(x.as)?.name||''):t('unassigned')}</small><button class="g" onclick="tkSet('${x.id}','as')">${t('take')}</button><select style="width:auto" onchange="tkSet('${x.id}','st',this.value)">${['open','pending','closed'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${t('tk_'+s)}</option>`).join('')}</select></div>`:(x.status!=='closed'?`<div class="row"><button class="g" onclick="tkSet('${x.id}','st','closed')">${t('tk_closed')}</button></div>`:''))+
   `<div class="tkm">${x.msgs.map(m=>`<div class="m"><div class="mb"><div class="mh"><b>${esc(U(m.u)?.name||'?')}</b>${m.staff?'<span class="tag">STAFF</span>':''}<span class="mt">${new Date(m.ts).toLocaleString(L)}</span></div><div class="tx">${fmt(m.t)}</div></div></div>`).join('')}</div>`+(x.status==='closed'&&!staff?'':`<div class="row"><input id="tkr" placeholder="${t('reply')}" onkeydown="if(event.key==='Enter')tkReply('${x.id}')"><button onclick="tkReply('${x.id}')">${t('send')}</button></div>`)}}
 const l=all.filter(x=>staff||x.uid===UID).filter(x=>!staff||UI.tf==='all'||x.status===UI.tf||(UI.tf==='mine'&&x.as===UID)).sort((a,b)=>b.ts-a.ts);
 return (staff?`<div class="row">${['open','pending','closed','mine','all'].map(f=>`<span class="tb2 ${UI.tf===f?'on':''}" onclick="UI.tf='${f}';reTk()">${t('tk_'+f)}</span>`).join('')}</div>`:`<div class="card2"><input id="tks" placeholder="${t('subject')}"><select id="tkc">${['c_gen','c_bug','c_acc','c_rep'].map(k=>`<option>${t(k)}</option>`).join('')}</select><textarea id="tkb" rows="3" placeholder="${t('describe')}"></textarea><button onclick="tkNew()">${t('newticket')}</button></div>`)+(l.length?l.map(x=>`<div class="card" onclick="UI.tk='${x.id}';reTk()">${TKS[x.status]} <b>${esc(x.subj)}</b> <small>${esc(U(x.uid)?.name||'?')} · ${x.msgs.length} · ${new Date(x.ts).toLocaleDateString(L)}</small></div>`).join(''):empty('🎫',t('notk')))}
const reTk=()=>UI.tkCtx==='staff'?staffSet('tk'):usrSet('support');
function tkNew(){const s=$('#tks').value.trim(),b=$('#tkb').value.trim();if(!s||!b)return;mut(()=>{plat().tickets.push({id:nid(),uid:UID,subj:s,cat:$('#tkc').value,status:'open',ts:Date.now(),msgs:[{u:UID,t:b,ts:Date.now()}]})});toast(t('done'));reTk()}
function tkReply(id){const v=$('#tkr').value.trim();if(!v)return;mut(()=>{const x=plat().tickets.find(y=>y.id===id),st=rank(ME())>0&&x.uid!==UID;x.msgs.push({u:UID,t:v,ts:Date.now(),staff:st});x.status=st?'pending':'open'});reTk()}
function tkSet(id,k,v){mut(()=>{const x=plat().tickets.find(y=>y.id===id);if(k==='as')x.as=UID;else x.status=v});reTk()}
function staffSet(tab){const r=rank(ME());if(!r)return;let b='';
 if(tab==='tk'){UI.tkCtx='staff';b=tkHtml(1)}
 if(tab==='us'&&r>=2)b=`<input placeholder="${t('search')}" value="${esc(UI.uq||'')}" oninput="UI.uq=this.value;$('#ul').innerHTML=userRows()"><div id="ul">${userRows()}</div>`;
 if(tab==='sv'&&r>=3)b=Object.values(DB.srv).map(s=>`<div class="fr"><div class="dn" style="flex:1"><b>${esc(s.name)}</b><small>${Object.keys(s.mem).length} ${t('members')} · ${esc(U(s.owner)?.name||'?')} · Lv${svLvl(s)}</small></div><button class="r" onclick="admDelSrv('${s.id}')">${t('del')}</button></div>`).join('')||empty('🏰',t('none'));
 if(tab==='an'&&r>=3)b=`<h3>${t('announce')}</h3><div class="row"><input id="anx" value="${esc(plat().ann||'')}"><button onclick="mut(()=>{plat().ann=$('#anx').value});toast(t('done'))">${t('save')}</button></div>`;
 if(tab==='ps'&&r>=4)b=posHtml();
 if(tab==='bg'&&r>=4)b=bdgHtml();
 const tabs=[['tk','🎫 '+t('tickets')]];if(r>=2)tabs.push(['us','👥 '+t('users')]);if(r>=3)tabs.push(['sv','🏰 '+t('servers')],['an','📢 '+t('announce')]);if(r>=4)tabs.push(['ps','🏷 '+t('positions')],['bg','🎖 '+t('badgesm')]);
 open(shell(tabs,tab,'staffSet',`<h2>🛡 ${t('ctrl')} · ${esc(posName(posOf(ME())))}</h2>`+b),'wide')}
function userRows(){const r=rank(ME()),q=(UI.uq||'').toLowerCase();return Object.values(DB.users).filter(u=>u.name.toLowerCase().includes(q)).slice(0,40).map(u=>{const ab=plat().bans[u.id],c2=r>rank(u)&&u.id!==UID;
 return `<div class="fr" style="flex-wrap:wrap">${av(u,38)}<div class="dn" style="flex:1"><b>${esc(u.name)}${posOf(u)?` <span class="tag" style="background:${posOf(u).color}">${esc(posName(posOf(u)))}</span>`:''}</b><small>${aur(u)?'✨ '+untilTxt(u.aurum)+' · ':''}${noAur(u)?'⛔ '+untilTxt(u.noAurum)+' · ':''}${ab?'🚫 · ':''}${u.id}</small></div><div class="acts" style="flex-wrap:wrap">`+
 (r>=2&&c2?`<span title="Aurum" onclick="aurModal('${u.id}')">✨</span>`:'')+(r>=3&&aur(u)?`<span title="${t('revoke')}" onclick="aurRevoke('${u.id}')">↩</span>`:'')+(r>=3&&c2?`<span title="${t('forbid')}" onclick="aurForbid('${u.id}')">⛔</span>`:'')+(r>=2&&c2?`<span title="${t('appban')}" onclick="appBan('${u.id}')">${ab?'♻':'🚫'}</span>`:'')+(r>=4?`<span title="${t('position')}" onclick="posAssign('${u.id}')">🏷</span><span title="${t('badgesm')}" onclick="bdgAssign('${u.id}')">🎖</span>`:'')+(r>=3&&c2?`<span title="${t('del')}" onclick="admDelUser('${u.id}')">🗑</span>`:'')+`</div></div>`}).join('')}
const DUR=[[1,'1 '+'d'],[7,'7 d'],[30,'30 d'],[90,'90 d'],[365,'365 d'],[0,'∞']];
const durSel=id=>`<select id="${id}" style="width:auto">${DUR.map(([d,l])=>`<option value="${d}">${d?l:t('forever')}</option>`).join('')}</select>`;
function aurModal(uid){if(rank(ME())<2)return;const u=U(uid);open(`<h2>✨ Aurum — ${esc(u.name)}</h2>`+(noAur(u)?`<p style="color:var(--rd)">⛔ ${t('forbidden')} ${untilTxt(u.noAurum)}</p>`:`<div class="row">${durSel('ad')}<button onclick="aurGrant('${uid}')">${t('grant')}</button></div>`))}
function aurGrant(uid){if(rank(ME())<2)return;const d=+$('#ad').value;mut(()=>{const u=U(uid);if(noAur(u))return;u.aurum={until:d?Date.now()+d*864e5:0,by:UID}});closeM();toast(t('done'));staffSet('us')}
function aurRevoke(uid){if(rank(ME())<3)return toast(t('noperm'),1);mut(()=>{delete U(uid).aurum});staffSet('us')}
function aurForbid(uid){if(rank(ME())<3)return;open(`<h2>⛔ ${t('forbid')} — ${esc(U(uid).name)}</h2><div class="row">${durSel('ad')}<button class="r" onclick="aurFb('${uid}',1)">${t('forbid')}</button><button class="g" onclick="aurFb('${uid}',0)">${t('allow')}</button></div>`)}
function aurFb(uid,on){const d=+$('#ad').value;mut(()=>{const u=U(uid);if(on){u.noAurum={until:d?Date.now()+d*864e5:0};delete u.aurum}else delete u.noAurum});closeM();staffSet('us')}
function appBan(uid){const r=rank(ME()),b=plat().bans[uid];if(b){mut(()=>{delete plat().bans[uid]});return staffSet('us')}const m=prompt(t('banmin'),'60');if(m===null)return;const n=Math.max(0,+m||0);if(!n&&r<3)return toast(t('noperm'),1);const why=prompt(t('reason'),'')||'';mut(()=>{plat().bans[uid]={until:n?Date.now()+n*6e4:0,reason:why,by:UID}});staffSet('us')}
function admDelUser(uid){if(rank(ME())<3||!confirm(t('del')+' '+U(uid).name+'?'))return;purgeUser(uid);render();staffSet('us')}
function admDelSrv(id){if(rank(ME())<3||!confirm(t('del')+'?'))return;mut(()=>{delete DB.srv[id]});staffSet('sv')}
function posHtml(){const ps=Object.values(plat().pos);return `<h3>${t('positions')}</h3>`+ps.map(p=>`<div class="row"><span class="bdgi" style="--c1:${p.color};--c2:${p.color}">${ic(p.badge)}</span><input value="${esc(p.sys?posName(p):p.name)}" ${p.sys?'disabled':''} onchange="posUp('${p.id}','name',this.value)"><input type="color" value="${p.color}" onchange="posUp('${p.id}','color',this.value)"><span class="mu">R${p.rank}</span><button class="g" onclick="posImg('${p.id}')">🖼</button>${p.sys?'':`<button class="r" onclick="posDel('${p.id}')">✕</button>`}</div>`).join('')+`<h4>${t('newpos')}</h4><div class="row"><input id="pn" placeholder="${t('name')}"><select id="pr" style="width:auto">${[0,1,2,3].map(i=>`<option value="${i}">R${i}</option>`).join('')}</select><input id="pe" value="⭐" style="width:70px"><button onclick="posNew()">${t('create')}</button></div><small class="mu">${t('rank_hint')}</small>`}
function posUp(id,f,v){if(rank(ME())<4)return;mut(()=>{plat().pos[id][f]=v});staffSet('ps')}
function posImg(id){imgPick({w:96,png:1},d=>posUp(id,'badge',d))}
function posDel(id){mut(()=>{delete plat().pos[id];Object.values(DB.users).forEach(u=>{if(u.pos===id)delete u.pos})});staffSet('ps')}
function posNew(){const n=$('#pn').value.trim();if(!n)return;mut(()=>{const id='p'+nid();plat().pos[id]={id,name:n,badge:$('#pe').value||'⭐',color:COL[Math.floor(Math.random()*7)],rank:+$('#pr').value}});staffSet('ps')}
function posAssign(uid){const u=U(uid);open(`<h2>🏷 ${esc(u.name)}</h2>`+['',...Object.keys(plat().pos)].map(id=>`<div class="card" onclick="mut(()=>{${id?`U('${uid}').pos='${id}'`:`delete U('${uid}').pos`}});closeM();staffSet('us')">${id?bdg(posName(plat().pos[id]),plat().pos[id].badge,plat().pos[id].color,plat().pos[id].color)+' '+esc(posName(plat().pos[id]))+' <small>R'+plat().pos[id].rank+'</small>':'—'}</div>`).join(''))}
function bdgHtml(){const bs=Object.values(plat().badges);return `<h3>${t('badgesm')}</h3>`+bs.map(b=>`<div class="row">${bdg(b.name,b.img||b.emoji,b.color,b.color)}<span style="flex:1">${esc(b.name)}</span><button class="r" onclick="bdgDel('${b.id}')">✕</button></div>`).join('')+`<h4>${t('newbadge')}</h4><div class="row"><input id="bn" placeholder="${t('name')}"><input id="be" value="🏅" style="width:70px"><input id="bc" type="color" value="#7c5cff"></div><div class="row"><button class="g" onclick="bdgImg()">🖼 ${t('fromfile')}</button><button class="g" onclick="bdgUrl()">🔗 URL</button><button onclick="bdgNew()">${t('create')}</button></div><small class="mu">${UI.bimgTmp?'✅ '+t('imgready'):''}</small>`}
function bdgImg(){imgPick({w:96,png:1},d=>{UI.bimgTmp=d;staffSet('bg')})}
function bdgUrl(){const u=prompt('URL (https://…png)');if(u&&safeImg(u)){UI.bimgTmp=u;staffSet('bg')}}
function bdgNew(){const n=$('#bn').value.trim();if(!n)return;const img=UI.bimgTmp,em=$('#be').value,c=$('#bc').value;UI.bimgTmp=null;mut(()=>{const id='b'+nid();plat().badges[id]={id,name:n,emoji:em,img,color:c}});staffSet('bg')}
function bdgDel(id){mut(()=>{delete plat().badges[id];Object.values(DB.users).forEach(u=>u.gb=u.gb.filter(x=>x!==id))});staffSet('bg')}
function bdgAssign(uid){const u=U(uid),bs=Object.values(plat().badges);open(`<h2>🎖 ${esc(u.name)}</h2>`+(bs.map(b=>`<div class="card" onclick="bdgTog('${uid}','${b.id}')">${u.gb.includes(b.id)?'☑':'☐'} ${bdg(b.name,b.img||b.emoji,b.color,b.color)} ${esc(b.name)}</div>`).join('')||`<p class="mu">${t('none')}</p>`))}
function bdgTog(uid,id){mut(()=>{const u=U(uid);u.gb=u.gb.includes(id)?u.gb.filter(x=>x!==id):[...u.gb,id]});bdgAssign(uid)}

/* ---------- gateway sim / wrappers / init ---------- */
function gw(){clearInterval(timer);timer=setInterval(()=>{if(!UID||!ME()||!ME().test)return;const f=['PRESENCE_UPDATE','TYPING_START','GUILD_MEMBER_UPDATE','HEARTBEAT_ACK'];ev('recv',f[Math.floor(Math.random()*f.length)],{sim:1,seq:Date.now()%1e5})},2500)}
function annR(){const a=plat().ann,e=$('#ann');if(e){e.style.display=a?'flex':'none';e.textContent=a?'📢 '+a:''}}
const _render=render;render=function(){if(UID&&ME()){const b=plat().bans[UID];if(b&&(!b.until||b.until>Date.now())){logout();$('#ae').textContent=t('appbanned')+' '+(b.reason||'');return}applyPrefs()}_render();if(UID)annR()};
const _mainR=mainR;mainR=function(){_mainR();if(UI.v!=='home'&&UI.ref&&UI.ref[0]==='c'){const cid=UI.ref.slice(2),me=ME();if(mentionCnt(G(),cid)){me.mread[cid]=Date.now();save();railR();sideR()}}};
(function(){$('#main').insertAdjacentHTML('afterbegin','<div id="ann"></div>');$('#cmp').insertAdjacentHTML('beforebegin','<div id="attc" style="padding:0 16px"></div>');$('#cmp .box').insertAdjacentHTML('afterbegin','<span class="ib" onclick="attachPick()" style="margin-left:6px">📎</span>');$('#auth .ac').insertAdjacentHTML('beforeend','<div id="asv"></div>');
 load();authText();try{UID=sessionStorage.getItem('ae_uid')}catch(e){}if(UID&&DB.users[UID])start();else UID=null})();

</script>
